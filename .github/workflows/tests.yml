name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8081:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for ParaBank
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              http://localhost:8081/parabank/index.htm || true)
            if [ "$code" = "200" ]; then echo "ready after $i attempts"; exit 0; fi
            sleep 10
          done
          echo "ParaBank did not become ready"; exit 1
      - run: mvn -B test
        env:
          BASE_URL: http://localhost:8081/parabank/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testng-reports
          path: |
            target/surefire-reports/
            target/screenshots/
          retention-days: 14
